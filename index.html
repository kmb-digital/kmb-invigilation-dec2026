<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>KMB Invigilation Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one navy band (brand, nav, and a hero search on the landing page), then a single content column.
   The personal timetable is a day-by-time grid on wide screens and a day list on phones. */
:root{
  --bg:#f4efe3; --surface:#fffdf7; --surface2:#f8f1e1; --ink:#14274e; --muted:#5a6684; --line:#ddd3bc;
  --navy:#14274e; --navy-ink:#f6efdc; --navy-soft:#b9c3dc; --accent:#b8562a; --accent-ink:#ffffff; --amber:#e3a63a;
  --ok:#256f4e; --ok-bg:#dff0e6; --warn:#7a5000; --warn-bg:#fbeecb; --bad:#a82f25; --bad-bg:#f9dfdb; --info:#1f3b78; --info-bg:#e4e9f5;
  --serif:Georgia,'Times New Roman',serif; --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1730; --surface:#15224a; --surface2:#1a2a58; --ink:#f3ecdc; --muted:#a3adc8; --line:#2c3d6e;
  --navy:#0a1229; --navy-ink:#f3ecdc; --navy-soft:#a3adc8; --accent:#ec8f5e; --accent-ink:#1a1206; --amber:#e8b14f;
  --ok:#6fcf9f; --ok-bg:#16382f; --warn:#f0c15a; --warn-bg:#3b3012; --bad:#ff8f80; --bad-bg:#40181a; --info:#a9bff2; --info-bg:#1d2e5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1730; --surface:#15224a; --surface2:#1a2a58; --ink:#f3ecdc; --muted:#a3adc8; --line:#2c3d6e;
  --navy:#0a1229; --navy-ink:#f3ecdc; --navy-soft:#a3adc8; --accent:#ec8f5e; --accent-ink:#1a1206; --amber:#e8b14f;
  --ok:#6fcf9f; --ok-bg:#16382f; --warn:#f0c15a; --warn-bg:#3b3012; --bad:#ff8f80; --bad-bg:#40181a; --info:#a9bff2; --info-bg:#1d2e5e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100%}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
p{margin:0}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.site{background:var(--navy);color:var(--navy-ink)}
.site .wrap{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;justify-content:space-between;padding-block:12px 0}
.brandbtn{display:flex;align-items:center;gap:14px;background:none;border:0;color:inherit;text-align:left;padding:0 0 12px}
.logo{height:52px;width:auto;flex:none;display:block}
.mark{width:42px;height:42px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--amber);flex:none}
.brandbtn b{display:block;font-family:var(--serif);font-size:21px;line-height:1.15}
.brandbtn span.s{display:block;font-size:12px;color:var(--navy-soft)}
#nav{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.nl{background:none;border:0;border-bottom:3px solid transparent;color:var(--navy-soft);padding:12px 12px 10px;font-weight:500;white-space:nowrap;display:flex;gap:8px;align-items:center}
.nl:hover{color:var(--navy-ink)}
.nl[aria-current="page"]{color:var(--navy-ink);border-bottom-color:var(--amber)}
.count{background:var(--accent);color:var(--accent-ink);border-radius:10px;font-size:11.5px;font-weight:600;padding:0 7px;min-width:20px;text-align:center}
.notice{background:var(--warn-bg);color:var(--warn);font-size:13px}
.notice .wrap{padding-block:7px}

/* hero + page bands */
.band{background:var(--navy);color:var(--navy-ink)}
.band.page .wrap{padding-block:22px 26px;display:flex;flex-direction:column;gap:6px}
.band.page h2{font-size:30px}
.band.page p{color:var(--navy-soft);max-width:70ch}
.band.hero .wrap{padding-block:34px 36px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:600}
.hero-t{font-size:clamp(30px,5.4vw,46px);line-height:1.08;max-width:18ch}
.hero-s{color:var(--navy-soft);max-width:58ch;font-size:16px}
.search{position:relative;width:100%;max-width:640px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:56px;border-radius:8px;border:2px solid transparent;background:var(--surface);color:var(--ink);padding:0 16px 0 48px;font-size:17px}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--amber)}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.3);max-height:340px;overflow-y:auto;z-index:20;padding:4px}
.sg{display:flex;justify-content:space-between;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:9px 12px}
.sg.on,.sg:hover{background:var(--surface2)}
.sg small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.sg-none{padding:10px 12px;color:var(--muted);font-size:14px}
.try{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--navy-soft)}
.pillbtn{background:rgba(255,255,255,.1);color:var(--navy-ink);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:3px 12px;font-size:13px}
.pillbtn:hover{background:rgba(255,255,255,.2)}
.dayrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dp{font-family:var(--mono);font-size:12px;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:5px 9px;color:var(--navy-soft);cursor:pointer}
.dp:hover,.dp:focus-visible{background:rgba(255,255,255,.12);border-color:var(--amber);color:#fff}
.dayhint{margin-top:16px;font-size:13px;color:var(--navy-soft)}
.dayhint+.dayrow{margin-top:8px}
.pdfrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--navy-soft)}
.pdfrow .pl{flex-basis:100%}
.pdfrow button{font:inherit;cursor:pointer;background:transparent;color:#fff;border:1px solid var(--amber);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;white-space:nowrap}
.pdfrow button:hover,.pdfrow button.on{background:var(--amber);color:var(--navy)}
.origv{margin-top:12px;background:var(--surface2);border-radius:8px;padding:10px;color:var(--ink)}
.origv .ot{font-size:13px;color:var(--muted);margin-bottom:8px}
.origv .op{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:4px;background:#fff;margin-bottom:10px}
.origv .op img{display:block;min-width:820px;width:100%;height:auto}

main.wrap{padding-block:26px 56px;display:flex;flex-direction:column;gap:28px}
h3{font-size:19px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.sec-h p{color:var(--muted);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.good b{color:var(--ok)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:6px}
.step .n{font-family:var(--serif);font-size:26px;color:var(--accent);line-height:1}
.step b{font-size:16px}
.step p{color:var(--muted);font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.bad{border-left:4px solid var(--bad)} .card.warn{border-left:4px solid var(--amber)} .card.ok{border-left:4px solid var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.row>*{min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 14px;font-weight:500;font-size:14px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:13px}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.plain{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.batch{font-size:11.5px;font-weight:600;border-radius:3px;padding:1px 6px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.batch.S3{background:var(--info-bg);color:var(--info)} .batch.S1{background:var(--warn-bg);color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dline{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.dline .dd{font-weight:600} .dline .ds{font-weight:500} .dline .dv{color:var(--muted);font-size:13px}
.note{font-size:13.5px;padding:7px 10px;border-radius:4px}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--bad-bg);color:var(--bad)} .note.ok{background:var(--ok-bg);color:var(--ok)} .note.info{background:var(--info-bg);color:var(--info)}
.empty{border:1px dashed var(--line);border-radius:6px;padding:18px;color:var(--muted);text-align:center}
details summary{cursor:pointer;font-weight:600;padding:6px 0}

/* personal timetable */
.who h3.name{font-size:28px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid}
.legend i.s3{background:var(--info-bg);border-color:var(--info)} .legend i.s1{background:var(--warn-bg);border-color:var(--warn)} .legend i.cl{background:var(--bad-bg);border-color:var(--bad)}
.tt-scroll{display:none;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.tt{min-width:980px;--rh:34px}
.tt-head,.tt-body{display:grid;grid-template-columns:52px 1fr}
.tt-days{display:grid;grid-template-columns:repeat(9,1fr)}
.tt-dh{padding:8px 4px;text-align:center;font-size:12.5px;border-left:1px solid var(--line);border-bottom:2px solid var(--navy);background:var(--surface2);line-height:1.25}
.tt-dh b{display:block;font-family:var(--serif);font-size:15px}
.tt-head>div:first-child{border-bottom:2px solid var(--navy);background:var(--surface2)}
.tt-axis{position:relative;height:calc(19*var(--rh))}
.tt-axis span{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted)}
.tt-cols{position:relative;display:grid;grid-template-columns:repeat(9,1fr);height:calc(19*var(--rh))}
.hl{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.7}
.tt-col{position:relative;border-left:1px solid var(--line)}
.blk{position:absolute;border-radius:4px;border:1px solid;padding:4px 6px;font-size:12px;line-height:1.3;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.blk b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.blk span{font-family:var(--mono);font-size:10.5px;opacity:.9}
.blk.S3{background:var(--info-bg);border-color:var(--info);color:var(--info)}
.blk.S1{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.blk.clash{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);border-width:2px}
.blk.chief::after{content:'K';position:absolute;right:4px;top:3px;font-size:10px;font-weight:700;background:var(--navy);color:var(--navy-ink);border-radius:3px;padding:0 4px}
.blk:hover{filter:brightness(.96);z-index:2}
.tt-list{display:flex;flex-direction:column;gap:18px}
.dayh{display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--navy);padding-bottom:4px}
.dayh h3{font-size:18px}
.duty{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:8px}
.duty.clash{border-color:var(--bad);background:var(--bad-bg)}
@media (min-width:760px){.tt-scroll{display:block}.tt-list{margin-top:18px}}
.duty .co .cl{min-width:68px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.duty .co{margin-top:6px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.duty .co.alone b{color:var(--warn)}
.duty .cn{font:inherit;font-size:13px;font-weight:600;color:var(--navy);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.duty .cn small{margin-left:4px;font-size:10px;background:var(--navy);color:#fff;border-radius:3px;padding:0 4px}
.duty .cn:hover{border-color:var(--navy)}

/* swap checker + roster */
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ctl label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.ctl select,.ctl input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px;color:var(--ink);width:100%}
.ctl label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.optrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}
.msg{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:8px;color:var(--ink);font-size:13.5px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:150px;color:var(--ink)}
.filters .grow{flex:1;min-width:200px} .filters .grow input{width:100%}
.exam{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.exam-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.exam-h .t{font-family:var(--mono);font-size:13px;color:var(--muted)} .exam-h .s{font-weight:600} .exam-h .v{color:var(--muted);font-size:13px}
.shifts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.shift{padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.shift+.shift{border-left:1px solid var(--line)}
.shift .w{font-family:var(--mono);font-size:12px;color:var(--muted)}
.names{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:2px 8px;font-size:13.5px;display:inline-flex;gap:5px;align-items:center}
button.chip:hover{border-color:var(--accent)}
.chip.chief{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.chip.clash{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.chip.hit{outline:2px solid var(--amber)}
.chip small{font-size:10.5px;font-weight:600;opacity:.8;letter-spacing:.04em}
@media (max-width:640px){.shift+.shift{border-left:0;border-top:1px solid var(--line)}}

.foot{border-top:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:13px}
.foot .wrap{padding-block:18px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);border-radius:6px;padding:10px 16px;font-size:14px;z-index:40;max-width:min(92vw,520px);box-shadow:0 4px 18px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:no-preference){.nl{transition:color .15s}.btn,.sg{transition:background .15s}}
.avoid{border:0;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.avoid legend{font-size:12.5px;color:var(--muted);padding:0;margin-bottom:6px;float:left;width:100%}
.av{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:3px 11px;font-size:13.5px;background:var(--surface);cursor:pointer}
.av:has(input:checked){background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--bad-bg);color:var(--bad);border-left:4px solid var(--bad);border-radius:4px;padding:10px 12px;font-size:14px;line-height:1.45;font-weight:500}
.alert svg{flex:none;margin-top:2px}
.alert b{display:block;font-size:15px}
</style>
</head>
<body>

<header class="site">

/* ---------- clash logic (a 5 minute handover overlap between shifts is normal) ---------- */
const overlap = (a, b) => Math.min(a.end, b.end) - Math.max(a.start, b.start);
const clashing = (a, b) => a !== b && a.date === b.date && overlap(a, b) > 5;

function findClashes() {
  const by = {}, out = [];
  DUTIES.forEach(d => { const k = who(d); (by[k] = by[k] || []).push(d); });
  Object.keys(by).forEach(name => {
    const l = by[name];
    for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++) {
      if (clashing(l[i], l[j])) out.push({ name, a: l[i], b: l[j], mins: overlap(l[i], l[j]) });
    }
  });
  return out;
}

/* A gives dutyA to B and takes dutyB. Returns clashes created for either side. */
function swapCheck(dutyA, dutyB) {
  const A = who(dutyA), B = who(dutyB), issues = [];
  DUTIES.forEach(o => {
    if (who(o) === A && o !== dutyA && clashing(o, dutyB)) issues.push({ who: A, other: o });
    if (who(o) === B && o !== dutyB && clashing(o, dutyA)) issues.push({ who: B, other: o });
  });
  return { issues, chiefMismatch: dutyA.chief !== dutyB.chief };
}

function evidence(a, b) {
  const A = DUTIES.filter(d => d.name === a), B = DUTIES.filter(d => d.name === b);
  for (const x of A) for (const y of B) if (x.exam === y.exam && x.shiftIndex === y.shiftIndex) return { kind: 'shift', x, y };

}

/* ---------- data check ---------- */
function viewCheck() {
  const cl = findClashes(), todo = PAIRS.filter(needs).length, T = teachers().length;
  const stats = '<div class="stats">' +
    '<div class="stat"><b>' + DUTIES.length + '</b><span>duty slots</span></div>' +
    '<div class="stat"><b>' + EXAMS.length + '</b><span>exam blocks</span></div>' +
    '<div class="stat"><b>' + T + '</b><span>names on the roster</span></div>' +
    '<div class="stat ' + (cl.length ? 'bad' : 'good') + '"><b>' + cl.length + '</b><span>' + (cl.length === 1 ? 'clash' : 'clashes') + '</span></div>' +
    '<div class="stat ' + (todo ? 'warn' : 'good') + '"><b>' + todo + '</b><span>names to review</span></div></div>';

  const clashHtml = cl.length ? cl.map(c => '<div class="card bad"><div class="row"><div><b>' + esc(c.name) + '</b> is on two duties at the same time <span class="muted small">(' + c.mins + ' minutes overlap)</span></div></div>' +
    [c.a, c.b].map(d => '<div class="optrow" style="border-top:0;padding-top:0"><div>' + dutyLine(d) + '<div class="tags">' + bTag(d.exam.batch) + '</div></div><button class="btn sm" data-act="findSwap" data-name="' + esc(c.name) + '" data-id="' + d.id + '">Find a swap</button></div>').join('') + '</div>').join('')
    : '<div class="card ok">No clashes. Every teacher was checked across both timetables.</div>';

  const decided = p => {
    const dec = S.decisions[p.id];
    return '<div class="row"><span class="pill ' + (dec.t === 'merged' ? 'ok' : 'plain') + '">' + (dec.t === 'merged' ? 'Merged as ' + esc(dec.keep) : 'Kept separate') + '</span><button class="btn sm" data-act="undo" data-pair="' + p.id + '">Undo</button></div>';
  };
  const pairCard = p => {
    const e = evidence(p.a, p.b), dec = S.decisions[p.id];
    let why = p.why || '', proof = '';
    if (p.kind === 'same') proof = e ? '<div class="note bad">Careful: ' + esc(evText(e)) + '</div>' : '<div class="small muted">Never on the same shift and never at overlapping times, so very likely one person.</div>';
    if (p.kind === 'look') why = 'The spellings are close, and nothing in the timetables proves they are different people.';
    let btns;
    if (dec) btns = decided(p);
    else if (p.kind === 'same') btns = '<div class="btns"><button class="btn sm primary" data-act="merge" data-pair="' + p.id + '" data-keep="' + esc(p.a) + '">Merge as ' + esc(p.a) + '</button><button class="btn sm" data-act="merge" data-pair="' + p.id + '" data-keep="' + esc(p.b) + '">Merge as ' + esc(p.b) + '</button><button class="btn sm" data-act="separate" data-pair="' + p.id + '">Keep separate</button></div>';
    else btns = '<div class="btns"><button class="btn sm" data-act="merge" data-pair="' + p.id + '" data-keep="' + esc(p.a) + '">Same person, use ' + esc(p.a) + '</button><button class="btn sm" data-act="separate" data-pair="' + p.id + '">Different people</button></div>';
    return '<div class="card ' + (dec ? 'ok' : 'warn') + '"><div class="row"><div><b>' + esc(p.a) + '</b> <span class="muted">and</span> <b>' + esc(p.b) + '</b></div><span class="mono muted">' + plural(nDuties(p.a), 'duty') + ' · ' + plural(nDuties(p.b), 'duty') + '</span></div>' +
      (why ? '<div class="small">' + esc(why) + '</div>' : '') + proof + btns + '</div>';
  };
  const same = PAIRS.filter(p => p.kind === 'same').map(pairCard).join('');
  const confirm = PAIRS.filter(p => p.kind === 'confirm' || (p.kind === 'look' && !evidence(p.a, p.b))).map(pairCard).join('') +
    UNMATCHED.map(u => '<div class="card warn"><div><b>' + esc(u.name) + '</b></div><div class="small">' + esc(u.why) + ' Check the spelling with the person.</div></div>').join('');
  const proven = PAIRS.filter(p => p.kind === 'look' && evidence(p.a, p.b));
  const provenHtml = '<details><summary>Look alike, but different people (' + proven.length + ')</summary><div class="sec" style="gap:8px">' + proven.map(p => '<div class="card"><div><b>' + esc(p.a) + '</b> <span class="muted">and</span> <b>' + esc(p.b) + '</b></div><div class="small muted">' + esc(evText(evidence(p.a, p.b))) + '</div></div>').join('') + '</div></details>';
  const notes = '<div class="sec" style="gap:8px">' + NOTES.map(n => '<div class="card"><div class="row" style="justify-content:flex-start"><span class="pill ' + (n.tag === 'Fixed' ? 'ok' : 'warn') + '">' + n.tag + '</span><span>' + esc(n.text) + '</span></div></div>').join('') + '</div>';

  return stats +
    section('Double-booked teachers', 'Two duties at the same time, across both batches.', clashHtml) +
    section('Probably the same person', 'Different spellings of one name. Pick the correct spelling and the swap checker and clash check use it everywhere.', same) +
    section('Please confirm', 'Short names and close spellings the tool cannot settle.', confirm) +
    provenHtml +
    section('Notes about the PDFs', 'Where the layout was unclear.', notes);
}

function suggest(q) {
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  const res = [];
  teachers().forEach(n => {
    const names = [n].concat(aliasesOf(n));
    const hit = names.find(x => toks.every(t => x.toLowerCase().includes(t)));
    if (hit) res.push({ n, via: hit !== n ? hit : null, score: hit.toLowerCase().startsWith(toks[0]) ? 0 : 1 });
  });
  res.sort((a, b) => a.score - b.score || a.n.localeCompare(b.n));
  return res.slice(0, 8);
}
function showSuggest() {

function lanes(list) {
  const ends = [], out = [];
  list.forEach(d => {
    let l = ends.findIndex(e => e <= d.start + 5);
    if (l < 0) { l = ends.length; ends.push(0); }
    ends[l] = d.end; out.push({ d, l });
  });
  const n = Math.max(1, ends.length);
  return out.map(o => ({ d: o.d, l: o.l, n }));
}
function timetableGrid(name, list, cids) {
  const T0 = 450, RH = 34, days = DAYS();
  const axis = []; for (let h = 8; h <= 17; h++) axis.push(h);
  const lbl = h => (h % 12 || 12) + (h >= 12 ? ' pm' : ' am');
  const cols = days.map(dt => {
    const ds = list.filter(d => d.date === dt).sort((a, b) => a.start - b.start);
    return '<div class="tt-col">' + lanes(ds).map(o => {
      const d = o.d, top = (d.start - T0) / 30 * RH, h = (d.end - d.start) / 30 * RH, w = 100 / o.n;
      return '<button class="blk ' + d.exam.batch + (d.chief ? ' chief' : '') + (cids.has(d.id) ? ' clash' : '') + '" style="top:' + top + 'px;height:' + h + 'px;left:calc(' + (o.l * w) + '% + 2px);width:calc(' + w + '% - 4px)" data-act="findSwap" data-name="' + esc(name) + '" data-id="' + d.id + '" title="' + esc(d.exam.subject + ' · ' + fwin(d.win) + ' · ' + venueTxt(d.exam) + (d.chief ? ' · Chief invigilator' : '') + ' · Tap to find a swap') + '"><b>' + esc(d.exam.subject) + '</b><span>' + fwin(d.win) + '</span><span>' + esc(d.exam.venue) + '</span></button>';
    }).join('') + '</div>';
  }).join('');
  return '<div class="tt-scroll"><div class="tt"><div class="tt-head"><div></div><div class="tt-days">' + days.map(dt => { const p = fmtDate(dt).split(' '); return '<div class="tt-dh"><b>' + p[0] + '</b>' + p[1] + ' ' + p[2] + '</div>'; }).join('') + '</div></div>' +
    '<div class="tt-body"><div class="tt-axis">' + axis.map(h => '<span style="top:' + ((h * 60 - T0) / 30 * RH) + 'px">' + lbl(h) + '</span>').join('') + '</div>' +
    '<div class="tt-cols">' + axis.map(h => '<div class="hl" style="top:' + ((h * 60 - T0) / 30 * RH) + 'px"></div>').join('') + cols + '</div></div></div></div>';
}
const coOf = d => d.exam.shifts[d.shiftIndex].duties.filter(x => x.id !== d.id);
const chipOf = x => '<button class="cn" data-act="pick" data-name="' + esc(who(x)) + '">' + esc(who(x)) + (x.chief ? '<small>K</small>' : '') + '</button>';
function coHtml(d) {
  const co = coOf(d), sh = d.exam.shifts;
  let h = co.length ? '<div class="co"><span class="cl">With you</span> ' + co.map(chipOf).join('') + '</div>'
    : '<div class="co alone"><b>Single invigilator</b> · no co-invigilator in this session</div>';
  const prev = sh[d.shiftIndex - 1], next = sh[d.shiftIndex + 1];
  if (prev) h += '<div class="co"><span class="cl">Before you</span> ' + prev.duties.map(chipOf).join('') + '</div>';
  if (next) h += '<div class="co"><span class="cl">After you</span> ' + next.duties.map(chipOf).join('') + '</div>';
  return h;
}
function timetableList(name, list, cids) {
  return '<div class="tt-list">' + Array.from(new Set(list.map(d => d.date))).map(dt => '<div><div class="dayh"><h3>' + fmtDate(dt) + '</h3></div>' + list.filter(d => d.date === dt).map(d => {
    const bad = cids.has(d.id);
    return '<div class="duty' + (bad ? ' clash' : '') + '"><div>' + dutyLine(d, { date: false }) + '<div class="tags">' + roleTags(d) + '<span class="pill plain">Paper ' + fwin(d.exam.examTime) + '</span>' + (bad ? ' <span class="pill bad">Clash</span>' : '') + '</div>' + coHtml(d) + '</div><button class="btn sm" data-act="findSwap" data-name="' + esc(name) + '" data-id="' + d.id + '">Find a swap</button></div>';
  }).join('') + '</div>').join('') + '</div>';
}
function resultHtml(name) {
  const list = dutiesOf(name), cids = clashIds();
  if (!list.length) return '<div class="card warn"><p class="eyebrow" style="color:var(--accent)">Timetable for</p><h3 class="name">' + esc(name) + '</h3><div>No invigilation duties found for this name in the Semester 3 or Semester 1 timetables.</div><div class="small muted">If you expected a duty, check the spelling or ask the exam coordinator. Names are matched as printed in the timetable.</div></div>';
  const days = new Set(list.map(d => d.date)).size, chiefN = list.filter(d => d.chief).length, bad = list.filter(d => cids.has(d.id)).length;
  const printed = aliasesOf(name);
  return '<div class="card who"><div class="row"><div><p class="eyebrow" style="color:var(--accent)">Timetable for</p><h3 class="name">' + esc(name) + '</h3>' + (printed.length ? '<div class="small muted">Also printed as ' + printed.map(esc).join(', ') + '</div>' : '') + '</div>' +
    '<div class="btns"><button class="btn primary" data-act="swapFor" data-name="' + esc(name) + '">Find a swap</button><button class="btn" data-act="copyTT" data-name="' + esc(name) + '">Copy as text</button></div></div>' +
    '<div class="tags" style="margin:0"><span class="pill info">' + plural(list.length, 'duty slot') + '</span><span class="pill plain">' + plural(days, 'exam day') + '</span>' + (chiefN ? '<span class="pill plain">' + chiefN + ' as chief invigilator</span>' : '') + '</div>' +
    (bad ? '<div class="note bad">Two of your duties are at the same time. They are shown in red. Tap one to look for a swap.</div>' : '<div class="note ok">No clashes in your duties.</div>') + '</div>' +
    '<div class="legend"><span><i class="s3"></i>Semester 3 · Batch 2025–27</span><span><i class="s1"></i>Semester 1 · Batch 2026–28</span><span><i class="cl"></i>Clash</span><span>K = chief invigilator</span><span>Tap a duty to find a swap</span></div>' +
    timetableGrid(name, list, cids) + timetableList(name, list, cids);
}
function timetableText(name) {
  const blocks = dutiesOf(name).map(d => {
    const ex = d.exam, sem = BATCH[ex.batch].short;
    const lines = ['*' + fmtDate(d.date) + ' | ' + fwin(d.win) + '*', '| ' + ex.subject, '| ' + ex.venue, '| ' + (ex.nos ? ex.nos + ' students (' + sem + ')' : sem)];
    if (d.chief) lines.push('| Chief invigilator');
    if (d.tag) lines.push('| ' + d.tag);
    return lines.join('\n');
  });
  return '*Invigilation duties:*\n*' + name + '*\n\n' + blocks.join('\n\n');
}
function toast(msg) {
  $('#toast').innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
  clearTimeout(S.tt); S.tt = setTimeout(() => { $('#toast').innerHTML = ''; }, 4000);
}
function swapMessage(give, get) {
  const slot = d => '*' + fmtDate(d.date) + ', ' + fwin(d.win) + '*';
  return 'Hi *' + who(get) + '*, can we swap invigilation duty?\n\n' +
    'I give: ' + give.exam.subject + ', ' + slot(give) + ' (' + venueTxt(give.exam) + ').\n\n' +
    'I take yours: ' + get.exam.subject + ', ' + slot(get) + ' (' + venueTxt(get.exam) + ').\n\n' +
    'No clash for either of us. Thank you.';
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, ds = t.dataset, pair = PAIRS.find(p => p.id === ds.pair);
  if (a === 'orig') { S.orig = S.orig === ds.k ? null : ds.k; render(); }
  else if (a === 'tab') { S.tab = ds.tab; render(); }
  else if (a === 'day') { S.q = ''; S.tab = 'roster'; S.batch = 'all'; S.date = ds.date; render(); window.scrollTo(0, 0); }
  else if (a === 'who') { S.q = ds.name; S.tab = 'roster'; S.batch = 'all'; S.date = 'all'; render(); window.scrollTo(0, 0); }
  else if (a === 'merge') { applyMerge(pair, ds.keep); render(); toast('Merged. Clash check and swap checker now use ' + ds.keep + '.'); }
  else if (a === 'separate') { S.decisions[pair.id] = { t: 'separate' }; render(); }
  else if (a === 'undo') { undoDecision(ds.pair); render(); }
  else if (a === 'findSwap') { S.me = ds.name; S.giveId = ds.id; S.copyText = ''; S.tab = 'swap'; render(); window.scrollTo(0, 0); }
  else if (a === 'copy') {
    const give = DUTIES.find(d => d.id === S.giveId), get = DUTIES.find(d => d.id === ds.get);
    if (!give || !get) return;
    S.copyText = swapMessage(give, get);
    $('#swapResults').innerHTML = swapResultsHtml();
    try {
      navigator.clipboard.writeText(S.copyText).then(() => toast('Message copied. Send it to ' + who(get) + ' yourself.'), () => toast('Select the message in the box and copy it.'));
    } catch (err) { toast('Select the message in the box and copy it.'); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sMe') { pickMe(t.value); render(); }
  else if (t.id === 'sGive') { S.giveId = t.value; S.copyText = ''; render(); }
  else if (t.id === 'sDay') { S.sDay = t.value; render(); }
  else if (t.id === 'sBatch') { S.sBatch = t.value; render(); }
  else if (t.id === 'sRole') { S.sameRole = t.checked; render(); }
  else if (t.id === 'fBatch') { S.batch = t.value; render(); }
  else if (t.id === 'fDate') { S.date = t.value; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'sQ') { S.sQ = t.value; $('#swapResults').innerHTML = swapResultsHtml(); }
  else if (t.id === 'fQ') { S.q = t.value; $('#rosterList').innerHTML = rosterListHtml(); }
});


document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!e.target.closest('.search')) closeSuggest();
  if (!t) return;
  const a = t.dataset.act, n = t.dataset.name;
  if (a === 'pick') selectName(n);
  else if (a === 'swapFor') { pickMe(n); S.tab = 'swap'; render(); window.scrollTo(0, 0); }
  else if (a === 'copyTT') {
    const txt = timetableText(n);
    try { navigator.clipboard.writeText(txt).then(() => toast('Timetable copied.'), () => toast('Your browser blocked copying.')); } catch (err) { toast('Your browser blocked copying.'); }
  }
  else if (a === 'tab') window.scrollTo(0, 0);
});
document.addEventListener('input', e => {
  if (e.target.id !== 'hq') return;
  S.hq = e.target.value; S.sug = suggest(S.hq); S.si = S.sug.length ? 0 : -1; showSuggest();
  if (!S.hq.trim() && S.home) { S.home = ''; $('#view').innerHTML = viewHome(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id !== 'hq') return;
  if (e.key === 'ArrowDown') { e.preventDefault(); if (S.sug.length) { S.si = Math.min(S.sug.length - 1, S.si + 1); showSuggest(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (S.sug.length) { S.si = Math.max(0, S.si - 1); showSuggest(); } }
  else if (e.key === 'Enter') { e.preventDefault(); if (S.sug.length) selectName(S.sug[Math.max(0, S.si)].n); }
  else if (e.key === 'Escape') closeSuggest();
});

['p14','p15','p16'].forEach(id => { S.decisions[id] = { t: 'separate' }; });
pickMe('');
render();
